<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Atendimentos</title>
<style>
  :root{
    --bg:#0b141a; --painel:#111b21; --barra:#202c33; --barra2:#2a3942;
    --linha:#2f3b43; --txt:#e9edef; --mut:#8696a0; --verde:#00a884;
    --verde-esc:#005c4b; --bolha-in:#202c33; --bolha-out:#005c4b;
    --erro:#f15c6d; --ok:#00a884;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);}
  .esconde{display:none !important;}
  input,select,button,textarea{font:inherit;color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#374248;border-radius:4px;}

  /* ---------------- LOGIN ---------------- */
  #login{height:100%;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(180deg,#00a884 0 130px,var(--bg) 130px);}
  #login .box{background:var(--painel);padding:32px;border-radius:14px;width:340px;
              border:1px solid var(--linha);box-shadow:0 12px 40px rgba(0,0,0,.4);}
  #login h1{font-size:19px;margin:0 0 4px;}
  #login p{color:var(--mut);margin:0 0 20px;font-size:13px;}
  .campo{width:100%;padding:11px 13px;margin:6px 0 14px;border-radius:8px;
         border:1px solid var(--linha);background:var(--bg);color:var(--txt);}
  .campo:focus{outline:none;border-color:var(--verde);}
  .btn{background:var(--verde);color:#04231c;border:0;padding:11px 16px;border-radius:8px;
       cursor:pointer;font-weight:700;}
  .btn:hover{filter:brightness(1.08);}
  .btn.sec{background:var(--barra2);color:var(--txt);font-weight:600;}
  .erro{color:var(--erro);min-height:18px;font-size:13px;}

  /* ---------------- APP ---------------- */
  #app{height:100%;display:flex;}
  /* rail de icones (menu para as outras funcoes) */
  .rail{width:64px;background:var(--barra);display:flex;flex-direction:column;
        align-items:center;padding:12px 0;gap:6px;border-right:1px solid var(--linha);}
  .rail .logo{width:40px;height:40px;border-radius:50%;background:var(--verde);
              display:flex;align-items:center;justify-content:center;color:#04231c;
              font-weight:800;margin-bottom:10px;}
  .rail button{width:44px;height:44px;border:0;background:none;color:var(--mut);
               border-radius:10px;cursor:pointer;display:flex;align-items:center;
               justify-content:center;font-size:20px;position:relative;}
  .rail button:hover{background:var(--barra2);color:var(--txt);}
  .rail button.on{background:var(--barra2);color:var(--verde);}
  .rail .fim{margin-top:auto;}
  .rail .rot{position:absolute;left:52px;background:#000a;padding:4px 8px;border-radius:6px;
             font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.1s;color:#fff;}
  .rail button:hover .rot{opacity:1;}

  /* area principal */
  .main{flex:1;min-width:0;display:flex;}

  /* coluna de lista (conversas) */
  .col-lista{width:360px;max-width:40%;background:var(--painel);border-right:1px solid var(--linha);
             display:flex;flex-direction:column;}
  .col-lista .topo{background:var(--barra);padding:14px 16px;font-weight:600;
                   display:flex;align-items:center;gap:10px;}
  .col-lista .busca{padding:8px 12px;background:var(--painel);}
  .col-lista .busca input{width:100%;padding:9px 14px;border-radius:8px;border:0;
                          background:var(--barra);color:var(--txt);}
  .col-lista .busca input:focus{outline:1px solid var(--verde);}
  .lista{flex:1;overflow:auto;}
  .item{display:flex;gap:12px;padding:11px 16px;cursor:pointer;border-bottom:1px solid #131f27;}
  .item:hover{background:var(--barra);}
  .item.on{background:var(--barra2);}
  .item .av{width:44px;height:44px;border-radius:50%;background:var(--barra2);flex:none;
            display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px;}
  .item .meio{flex:1;min-width:0;}
  .item .nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .prev{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .hora{color:var(--mut);font-size:11px;flex:none;}

  /* painel do diálogo / conteúdo */
  .col-dialogo{flex:1;min-width:0;display:flex;flex-direction:column;
               background:var(--bg);}
  .dlg-topo{background:var(--barra);padding:12px 18px;display:flex;align-items:center;gap:12px;
            border-bottom:1px solid var(--linha);}
  .dlg-topo .av{width:40px;height:40px;border-radius:50%;background:var(--barra2);
                display:flex;align-items:center;justify-content:center;color:var(--mut);}
  .dlg-corpo{flex:1;overflow:auto;padding:18px 8%;
             background-image:linear-gradient(rgba(11,20,26,.96),rgba(11,20,26,.96));}
  .bolha{max-width:75%;padding:7px 11px 5px;border-radius:8px;margin:4px 0;
         white-space:pre-wrap;word-wrap:break-word;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.2);}
  .bolha.in{background:var(--bolha-in);border-top-left-radius:0;}
  .bolha.out{background:var(--bolha-out);margin-left:auto;border-top-right-radius:0;}
  .bolha .h{font-size:10px;color:var(--mut);text-align:right;margin-top:2px;}
  .vazio{color:var(--mut);text-align:center;padding:40px 20px;margin:auto;max-width:420px;}
  .vazio .ic{font-size:44px;opacity:.5;}

  /* telas de conteudo (atendimentos, cliente, resumo, usuarios) */
  .conteudo{flex:1;overflow:auto;padding:22px;}
  .conteudo h2{margin:0 0 4px;font-size:18px;}
  .conteudo .sub{color:var(--mut);margin:0 0 20px;font-size:13px;}
  .barra-f{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .barra-f input,.barra-f select{padding:9px 12px;border-radius:8px;border:1px solid var(--linha);
        background:var(--painel);color:var(--txt);}
  table{width:100%;border-collapse:collapse;background:var(--painel);border-radius:10px;overflow:hidden;}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--linha);font-size:13px;}
  th{color:var(--mut);font-weight:600;background:var(--barra);}
  tr:last-child td{border-bottom:0;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .tag.ok{background:rgba(0,168,132,.18);color:#4fd6b0;}
  .tag.nao{background:rgba(241,92,109,.16);color:#ff96a2;}
  .tag.tipo{background:var(--barra2);color:var(--mut);}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px;}
  .card{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:18px;}
  .card .num{font-size:30px;font-weight:800;color:var(--verde);}
  .card .rot{color:var(--mut);font-size:13px;}

  @media(max-width:760px){
    .col-lista{width:100%;max-width:100%;}
    .col-dialogo.sem-sel{display:none;}
    .col-lista.tem-sel{display:none;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="box">
    <h1>Painel de Atendimentos</h1>
    <p>Entre com seu usuário e senha.</p>
    <label>Usuário</label>
    <input id="lg-user" class="campo" autocomplete="username">
    <label>Senha</label>
    <input id="lg-pass" class="campo" type="password" autocomplete="current-password">
    <div class="erro" id="lg-erro"></div>
    <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="esconde">
  <div class="rail" id="rail"></div>
  <div class="main" id="main"></div>
</div>

<script>
const $ = (s,r) => (r||document).querySelector(s);
let EU = null, SECAO = 'conv';

async function api(url, opts){
  const r = await fetch(url, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(r.status===401){ mostrarLogin(); throw new Error('nao_autenticado'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.erro || ('http_'+r.status));
  return j;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function dt(s){ const d=new Date(s); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function hora(s){ return new Date(s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fone(t){ // 559299... -> +55 92 9...  (so cosmetico)
  const d=String(t||'').replace(/\D/g,''); if(d.length<12) return t;
  return '+'+d.slice(0,2)+' '+d.slice(2,4)+' '+d.slice(4);
}
const TIPOS={wifi:'Wi-Fi',chamado:'Chamado',segunda_via:'2ª via',diagnostico:'Diagnóstico'};

function mostrarLogin(){ $('#app').classList.add('esconde'); $('#login').classList.remove('esconde'); }
async function entrar(){
  $('#lg-erro').textContent='';
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({usuario:$('#lg-user').value,senha:$('#lg-pass').value})});
    await iniciar();
  }catch(e){ $('#lg-erro').textContent = e.message==='credenciais_invalidas'?'Usuário ou senha incorretos.':'Não foi possível entrar.'; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('#login').classList.contains('esconde')) entrar(); });
async function sair(){ await api('/api/logout',{method:'POST'}).catch(()=>{}); location.reload(); }

const SECOES=[
  {id:'conv', ic:'💬', rot:'Conversas'},
  {id:'atend',ic:'📋', rot:'Atendimentos'},
  {id:'cliente',ic:'🔎', rot:'Consultar cliente'},
  {id:'resumo',ic:'📊', rot:'Resumo'},
  {id:'users',ic:'👥', rot:'Usuários', admin:true},
];

async function iniciar(){
  EU = await api('/api/eu');
  $('#login').classList.add('esconde'); $('#app').classList.remove('esconde');
  const rail=$('#rail'); rail.innerHTML='';
  const ini=(EU.usuario[0]||'?').toUpperCase();
  rail.innerHTML='<div class="logo" title="'+esc(EU.usuario)+'">'+esc(ini)+'</div>';
  SECOES.filter(s=>!s.admin||EU.papel==='admin').forEach(s=>{
    const b=document.createElement('button'); b.dataset.id=s.id;
    b.innerHTML=s.ic+'<span class="rot">'+s.rot+'</span>';
    b.onclick=()=>irPara(s.id); rail.appendChild(b);
  });
  const sair=document.createElement('button'); sair.className='fim';
  sair.innerHTML='⎋<span class="rot">Sair</span>'; sair.onclick=sair2; rail.appendChild(sair);
  irPara('conv');
}
function sair2(){ sair(); }

function irPara(id){
  SECAO=id;
  document.querySelectorAll('.rail button[data-id]').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  ({conv:telaConversas,atend:telaAtend,cliente:telaCliente,resumo:telaResumo,users:telaUsers}[id])();
}

/* ============ CONVERSAS (principal) ============ */
async function telaConversas(){
  $('#main').innerHTML =
    '<div class="col-lista" id="cl">'+
      '<div class="topo">💬 Conversas</div>'+
      '<div class="busca"><input id="cl-busca" placeholder="Buscar por telefone"></div>'+
      '<div class="lista" id="cl-lista"><div class="vazio">Carregando…</div></div>'+
    '</div>'+
    '<div class="col-dialogo sem-sel" id="dlg">'+
      '<div class="dlg-corpo"><div class="vazio"><div class="ic">💬</div>'+
      '<p>Selecione uma conversa para ver as mensagens.</p></div></div>'+
    '</div>';
  try{
    const rows = await api('/api/conversas');
    const lista=$('#cl-lista');
    if(!rows.length){
      lista.innerHTML='<div class="vazio"><div class="ic">🕓</div>'+
        '<p>Ainda não há conversas registradas.</p>'+
        '<p style="font-size:12px">O histórico começa a aparecer quando o bot for atualizado para guardar as mensagens.</p></div>';
      return;
    }
    window._convs=rows;
    pintarConversas(rows);
    $('#cl-busca').addEventListener('input',e=>{
      const q=e.target.value.replace(/\D/g,'');
      pintarConversas(rows.filter(r=>r.phone.includes(q)));
    });
  }catch(e){ $('#cl-lista').innerHTML='<div class="vazio">Erro ao carregar.</div>'; }
}
function pintarConversas(rows){
  $('#cl-lista').innerHTML = rows.map(r=>
    '<div class="item" data-p="'+esc(r.phone)+'" onclick="abrirConversa(\''+esc(r.phone)+'\',this)">'+
      '<div class="av">👤</div><div class="meio">'+
      '<div class="nome">'+esc(fone(r.phone))+'</div>'+
      '<div class="prev">'+(r.direcao==='out'?'→ ':'')+esc(r.texto||'')+'</div></div>'+
      '<div class="hora">'+hora(r.created_at)+'</div></div>').join('')
    || '<div class="vazio">Nada encontrado.</div>';
}
async function abrirConversa(phone,el){
  document.querySelectorAll('#cl-lista .item').forEach(x=>x.classList.remove('on'));
  if(el) el.classList.add('on');
  $('#cl').classList.add('tem-sel');
  const dlg=$('#dlg'); dlg.classList.remove('sem-sel');
  dlg.innerHTML='<div class="dlg-topo"><button class="btn sec" style="padding:6px 10px" onclick="voltarLista()">←</button>'+
    '<div class="av">👤</div><div><b>'+esc(fone(phone))+'</b></div></div>'+
    '<div class="dlg-corpo" id="dlg-corpo"><div class="vazio">Carregando…</div></div>';
  try{
    const msgs = await api('/api/conversas?phone='+encodeURIComponent(phone));
    const corpo=$('#dlg-corpo');
    corpo.innerHTML = msgs.length ? msgs.map(m=>
      '<div class="bolha '+(m.direcao==='out'?'out':'in')+'">'+esc(m.texto)+
      '<div class="h">'+hora(m.created_at)+'</div></div>').join('')
      : '<div class="vazio">Sem mensagens nesta conversa.</div>';
    corpo.scrollTop=corpo.scrollHeight;
  }catch(e){ $('#dlg-corpo').innerHTML='<div class="vazio">Erro.</div>'; }
}
function voltarLista(){ $('#cl').classList.remove('tem-sel'); $('#dlg').classList.add('sem-sel'); }

/* ============ ATENDIMENTOS ============ */
async function telaAtend(){
  $('#main').innerHTML='<div class="conteudo"><h2>Atendimentos</h2>'+
    '<p class="sub">Tudo que passou pelo atendimento automático.</p>'+
    '<div class="barra-f"><input id="f-q" placeholder="telefone, CPF ou contrato">'+
    '<select id="f-tipo"><option value="">Todos os tipos</option>'+
    Object.entries(TIPOS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+
    '</select><button class="btn" onclick="carregarAtend()">Filtrar</button></div>'+
    '<div id="tab"><div class="vazio">Carregando…</div></div></div>';
  carregarAtend();
}
async function carregarAtend(){
  const q=encodeURIComponent(($('#f-q')||{}).value?$('#f-q').value.trim():'');
  const tipo=($('#f-tipo')||{}).value||'';
  try{
    const rows=await api('/api/atendimentos?q='+q+'&tipo='+tipo);
    $('#tab').innerHTML = rows.length ?
      '<table><thead><tr><th>Quando</th><th>Tipo</th><th>Telefone</th><th>CPF</th><th>Contrato</th><th>Resultado</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td>'+dt(r.created_at)+'</td><td><span class="tag tipo">'+(TIPOS[r.tipo]||r.tipo)+'</span></td>'+
        '<td>'+esc(fone(r.phone))+'</td><td>'+esc(r.cpf)+'</td><td>'+esc(r.contrato_id||'')+'</td>'+
        '<td><span class="tag '+(r.sucesso?'ok':'nao')+'">'+(r.sucesso?'Sucesso':'Não')+'</span></td></tr>').join('')+
      '</tbody></table>' : '<div class="vazio">Nenhum atendimento.</div>';
  }catch(e){ $('#tab').innerHTML='<div class="vazio">Erro ao carregar.</div>'; }
}

/* ============ CONSULTAR CLIENTE ============ */
async function telaCliente(){
  $('#main').innerHTML='<div class="conteudo"><h2>Consultar cliente</h2>'+
    '<p class="sub">Dados no SGP e histórico no atendimento automático.</p>'+
    '<div class="barra-f"><input id="cl-doc" placeholder="CPF ou CNPJ (só números)">'+
    '<button class="btn" onclick="buscarCliente()">Buscar</button></div><div id="cl-res"></div></div>';
  $('#cl-doc').addEventListener('keydown',e=>{ if(e.key==='Enter') buscarCliente(); });
}
async function buscarCliente(){
  const doc=$('#cl-doc').value.replace(/\D/g,''); if(!doc) return;
  $('#cl-res').innerHTML='<div class="vazio">Buscando…</div>';
  try{
    const r=await api('/api/cliente?doc='+doc);
    const cs=(r.sgp&&r.sgp.contratos)||[]; let h='';
    if(!cs.length) h+='<div class="vazio">Nenhum contrato no SGP para esse documento.</div>';
    cs.forEach(c=>{ h+='<div class="card" style="margin-bottom:12px"><b>'+esc(c.razaoSocial||'')+'</b> '+
      '<span class="tag '+(c.contratoStatusDisplay==='Ativo'?'ok':'nao')+'">'+esc(c.contratoStatusDisplay||'')+'</span>'+
      '<br><span class="rot">Contrato '+esc(c.contratoId)+' · '+esc(c.servico_login||'')+' · '+esc(c.planointernet||'')+'</span>'+
      '<br><span class="rot">'+esc([c.endereco_logradouro,c.endereco_numero,c.endereco_bairro,c.endereco_cidade].filter(Boolean).join(', '))+'</span></div>'; });
    if(r.historico&&r.historico.length){
      h+='<h3 style="color:var(--mut)">Histórico no atendimento</h3><table><thead><tr><th>Quando</th><th>Tipo</th><th>Resultado</th></tr></thead><tbody>'+
        r.historico.map(x=>'<tr><td>'+dt(x.created_at)+'</td><td>'+(TIPOS[x.tipo]||x.tipo)+'</td>'+
        '<td><span class="tag '+(x.sucesso?'ok':'nao')+'">'+(x.sucesso?'Sucesso':'Não')+'</span></td></tr>').join('')+'</tbody></table>';
    }
    $('#cl-res').innerHTML=h;
  }catch(e){ $('#cl-res').innerHTML='<div class="vazio">'+(e.message==='sgp_indisponivel'?'SGP indisponível.':'Erro na consulta.')+'</div>'; }
}

/* ============ RESUMO ============ */
async function telaResumo(){
  $('#main').innerHTML='<div class="conteudo"><h2>Resumo</h2><p class="sub">Números do atendimento automático.</p><div id="rz"><div class="vazio">Carregando…</div></div></div>';
  try{
    const r=await api('/api/resumo');
    const porTipo=r.por_tipo.map(t=>'<div class="card"><div class="num">'+t.n+'</div><div class="rot">'+(TIPOS[t.tipo]||t.tipo)+' · '+t.ok+' ok</div></div>').join('');
    const maxS=Math.max(1,...r.semana.map(d=>d.n));
    const barras=r.semana.map(d=>'<div style="display:flex;align-items:center;gap:8px;margin:5px 0">'+
      '<span class="rot" style="width:52px">'+d.dia+'</span>'+
      '<div style="height:18px;border-radius:4px;background:var(--verde);width:'+Math.round(d.n/maxS*100)+'%;min-width:3px"></div>'+
      '<span class="rot">'+d.n+'</span></div>').join('');
    $('#rz').innerHTML='<div class="cards"><div class="card"><div class="num">'+r.hoje+'</div><div class="rot">Atendimentos hoje</div></div>'+
      '<div class="card"><div class="num">'+r.huawei_os+'</div><div class="rot">OS Huawei (TR-069)</div></div>'+porTipo+'</div>'+
      '<h3 style="color:var(--mut)">Últimos 7 dias</h3><div class="card">'+(barras||'<div class="vazio">Sem dados.</div>')+'</div>';
  }catch(e){ $('#rz').innerHTML='<div class="vazio">Erro.</div>'; }
}

/* ============ USUÁRIOS (admin) ============ */
async function telaUsers(){
  $('#main').innerHTML='<div class="conteudo"><h2>Usuários</h2><p class="sub">Contas de acesso ao painel.</p>'+
    '<div class="barra-f"><input id="u-nome" placeholder="novo usuário">'+
    '<input id="u-senha" type="password" placeholder="senha (mín. 6)">'+
    '<select id="u-papel"><option value="user">Usuário</option><option value="admin">Admin</option></select>'+
    '<button class="btn" onclick="criarUser()">Criar</button><span class="erro" id="u-erro"></span></div>'+
    '<div id="u-tab"><div class="vazio">Carregando…</div></div></div>';
  await listarUsers();
}
async function listarUsers(){
  try{
    const us=await api('/api/usuarios');
    $('#u-tab').innerHTML='<table><thead><tr><th>Usuário</th><th>Papel</th><th>Ativo</th><th>Último acesso</th><th></th></tr></thead><tbody>'+
      us.map(u=>'<tr><td>'+esc(u.usuario)+'</td><td>'+u.papel+'</td>'+
        '<td><span class="tag '+(u.ativo?'ok':'nao')+'">'+(u.ativo?'Sim':'Não')+'</span></td>'+
        '<td>'+(u.ultimo_login?dt(u.ultimo_login):'—')+'</td>'+
        '<td><button class="btn sec" style="padding:5px 10px" onclick="toggleUser('+u.id+','+(!u.ativo)+')">'+(u.ativo?'Desativar':'Ativar')+'</button> '+
        '<button class="btn sec" style="padding:5px 10px" onclick="resetSenha('+u.id+')">Nova senha</button></td></tr>').join('')+'</tbody></table>';
  }catch(e){ $('#u-tab').innerHTML='<div class="vazio">Erro.</div>'; }
}
async function criarUser(){
  $('#u-erro').textContent='';
  try{
    await api('/api/usuarios',{method:'POST',body:JSON.stringify({usuario:$('#u-nome').value.trim(),senha:$('#u-senha').value,papel:$('#u-papel').value})});
    telaUsers();
  }catch(e){ $('#u-erro').textContent=e.message==='usuario_ja_existe'?'Usuário já existe.':(e.message==='usuario_ou_senha_curta'?'Usuário e senha (mín. 6).':'Erro.'); }
}
async function toggleUser(id,ativo){ await api('/api/usuarios/'+id+'/ativo',{method:'POST',body:JSON.stringify({ativo})}).catch(()=>{}); listarUsers(); }
async function resetSenha(id){ const s=prompt('Nova senha (mín. 6):'); if(!s) return;
  try{ await api('/api/usuarios/'+id+'/senha',{method:'POST',body:JSON.stringify({senha:s})}); alert('Senha alterada.'); }catch(e){ alert('Erro (senha curta?).'); } }

iniciar().catch(()=>mostrarLogin());
</script>
