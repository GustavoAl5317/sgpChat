services:
  postgres:
    image: postgres:16-alpine
    container_name: botsgp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    # Sem "ports:" de proposito - o banco NAO fica exposto na internet,
    # so e alcancavel pelos outros containers na rede interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [botsgp]

  redis:
    image: redis:7-alpine
    container_name: botsgp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [botsgp]

  n8n:
    image: n8nio/n8n:latest
    container_name: botsgp-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      # O workflow le credenciais via $env.* nas expressoes.
      # Por padrao o n8n bloqueia isso; precisa liberar explicitamente.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Login da interface do n8n
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_LOG_LEVEL: info
      EXECUTIONS_DATA_PRUNE: "true"
      # Execucoes guardam CPF nos dados - nao acumular historico indefinidamente
      EXECUTIONS_DATA_MAX_AGE: 168

      # Credenciais consumidas pelos nodes do workflow
      SGP_API_URL: ${SGP_API_URL}
      SGP_API_TOKEN: ${SGP_API_TOKEN}
      SGP_APP_NAME: ${SGP_APP_NAME}
      SGP_OCORRENCIA_TIPO: ${SGP_OCORRENCIA_TIPO}
      # acs | genieacs | chamado | off - veja o .env.example. Sem Gerenciador
      # de CPE cadastrado no SGP, 'acs' falha em toda chamada; 'genieacs'
      # dispensa esse cadastro e escreve direto na NBI.
      WIFI_MODO: ${WIFI_MODO:-acs}
      # So usado por WIFI_MODO=genieacs. Aponta para a NBI CRUA (7557), sem
      # TLS e sem token, porque essa conversa acontece dentro da rede acs_nbi
      # e nunca chega a um cabo. O nginx da pasta genieacs/ continua existindo
      # para o outro consumidor da NBI - o SGP, que e SaaS e chega pela
      # internet. Sao dois caminhos com ameacas diferentes.
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
      # Opcional: fixa o caminho do usuario PPPoE no modelo de dados, depois
      # de descoberto no parque. Vazio, o bot tenta TR-098 e TR-181.
      GENIEACS_LOGIN_PARAM: ${GENIEACS_LOGIN_PARAM:-}
      # WIFI_MODO=olt. O n8n nao tem a credencial da OLT - ele pede ao servico
      # olt-wifi, que e quem a guarda e quem monta os comandos.
      OLT_WIFI_URL: ${OLT_WIFI_URL:-http://olt-wifi:8080}
      OLT_WIFI_TOKEN: ${OLT_WIFI_TOKEN:-}
      # Chassi da OLT no endereco gpon_onu-<chassi>/<slot>/<pon>:<onu>. E 1 nas
      # OLTs de prateleira unica.
      OLT_SHELF: ${OLT_SHELF:-1}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    # Duas redes: a interna (fala com Postgres/Evolution) e a do Traefik,
    # que termina o TLS e publica na internet. As rotas do Traefik sao
    # escritas por publicar-no-traefik.sh, nao por labels: o Traefik do
    # EasyPanel roda em Swarm e ignora labels de containers de compose.
    # acs_nbi so serve ao modo genieacs: e por ela que o n8n alcanca a NBI.
    # Entrar numa rede nao publica porta nenhuma - o GenieACS continua sem
    # expor a 7557 no host.
    networks: [botsgp, proxy, acs_nbi]

  # Unico lugar do stack que guarda a credencial da OLT. Existe para que o n8n
  # nao a tenha: o n8n conversa com o publico pelo WhatsApp, e um comprometimento
  # dele nao pode virar controle da rede inteira do provedor. Aqui o bot so
  # consegue pedir "troque o Wi-Fi desta ONU" - os comandos sao montados dentro
  # do servico, a partir de campos validados.
  #
  # So sobe com WIFI_MODO=olt. Nos outros modos fica parado sem atrapalhar.
  olt-wifi:
    build: ./olt-wifi
    container_name: botsgp-olt-wifi
    restart: unless-stopped
    mem_limit: 128m
    environment:
      OLT_HOST: ${OLT_HOST:-}
      OLT_PORT: ${OLT_PORT:-22}
      OLT_USER: ${OLT_USER:-}
      OLT_PASS: ${OLT_PASS:-}
      OLT_WIFI_TOKEN: ${OLT_WIFI_TOKEN:-}
      # Indices de SSID por banda. Confirmado em campo: 1-4 sao 2.4 GHz e 5-8
      # sao 5 GHz nas ONUs ZTE. Muda por modelo, entao e configuravel.
      OLT_WIFI_IF_24: ${OLT_WIFI_IF_24:-wifi_0/1}
      OLT_WIFI_IF_5G: ${OLT_WIFI_IF_5G:-wifi_0/5}
    # Sem "ports:": quem alcanca este servico e o n8n, pela rede interna.
    networks: [botsgp]

  evolution:
    # O projeto migrou de atendai/ para evoapicloud/ (atendai parou no v2.2.3).
    # Versao fixada de proposito: "latest" ja quebrou compatibilidade de env vars
    # entre releases da Evolution.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: botsgp-evolution
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # URL publica: o Manager usa isso para montar os links dele.
      SERVER_URL: https://${EVOLUTION_DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

      # Manda toda mensagem recebida direto para o workflow do n8n,
      # pela rede interna do Docker (nao passa pela internet).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://n8n:5678/webhook/evolution-inbound
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # Nao existe env var para pinar a versao do WhatsApp Web nesta imagem.
      # Conferido no fonte da v2.3.7: env.config.ts le so CLIENT e NAME, e o
      # whatsapp.baileys.service.ts resolve a versao em tempo de conexao com
      # fetchLatestWaWebVersion({}), que baixa https://web.whatsapp.com/sw.js e
      # tira o client_revision. Se essa chamada falhar (sem egress, DNS, timeout)
      # o Baileys cai calado na versao embutida no pacote, que envelhece - e ai o
      # celular recusa o QR com "codigo invalido". Ou seja: versao velha aqui e
      # sintoma de rede bloqueada ou de imagem defasada, nao de config faltando.
      # Diagnostico: bash recriar-instancia.sh
      # Nome que aparece em "Aparelhos conectados" no celular da empresa.
      CONFIG_SESSION_PHONE_CLIENT: ${WA_CLIENT_NAME:-Atendimento}
      CONFIG_SESSION_PHONE_NAME: Chrome

      # ERROR esconde justamente o motivo de uma falha de pareamento. Suba para
      # DEBUG no .env (LOG_LEVEL_EVOLUTION) enquanto estiver investigando.
      LOG_LEVEL: ${LOG_LEVEL_EVOLUTION:-ERROR}
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    # Tambem na rede do Traefik: a empresa acessa o Manager pelo navegador
    # para parear o WhatsApp, sem precisar de acesso ao servidor.
    networks: [botsgp, proxy]

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:

networks:
  # Rede interna: Postgres, Redis e Evolution vivem so aqui, sem porta
  # publicada. Ninguem alcanca de fora.
  botsgp:
    driver: bridge
  # Rede ja existente do Traefik (EasyPanel). Nao e criada por este compose -
  # descubra o nome com:
  #   docker inspect $(docker ps -qf name=traefik) \
  #     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
  # e coloque em TRAEFIK_NETWORK no .env.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
  # Ponte entre este stack e o do GenieACS (pasta genieacs/), que roda em
  # compose separado. Criada aqui e consumida la como external, entao a ordem
  # importa: suba este antes daquele. Com WIFI_MODO diferente de 'genieacs'
  # ela fica criada e sem uso - nao atrapalha nada.
  acs_nbi:
    driver: bridge
    name: acs_nbi
