services:
  postgres:
    image: postgres:16-alpine
    container_name: botsgp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    # Sem "ports:" de proposito - o banco NAO fica exposto na internet,
    # so e alcancavel pelos outros containers na rede interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [botsgp]

  redis:
    image: redis:7-alpine
    container_name: botsgp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [botsgp]

  n8n:
    image: n8nio/n8n:latest
    container_name: botsgp-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo

      # O workflow le credenciais via $env.* nas expressoes.
      # Por padrao o n8n bloqueia isso; precisa liberar explicitamente.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Login da interface do n8n
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_LOG_LEVEL: info
      EXECUTIONS_DATA_PRUNE: "true"
      # Execucoes guardam CPF nos dados - nao acumular historico indefinidamente
      EXECUTIONS_DATA_MAX_AGE: 168

      # Credenciais consumidas pelos nodes do workflow
      SGP_API_URL: ${SGP_API_URL}
      SGP_API_TOKEN: ${SGP_API_TOKEN}
      SGP_APP_NAME: ${SGP_APP_NAME}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [botsgp]

  evolution:
    # O projeto migrou de atendai/ para evoapicloud/ (atendai parou no v2.2.3).
    # Versao fixada de proposito: "latest" ja quebrou compatibilidade de env vars
    # entre releases da Evolution.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: botsgp-evolution
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

      # Manda toda mensagem recebida direto para o workflow do n8n,
      # pela rede interna do Docker (nao passa pela internet).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://n8n:5678/webhook/evolution-inbound
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks: [botsgp]

  caddy:
    image: caddy:2-alpine
    container_name: botsgp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [n8n]
    networks: [botsgp]

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
  caddy_data:
  caddy_config:

networks:
  botsgp:
    driver: bridge
