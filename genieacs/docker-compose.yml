# GenieACS - producao, gerencia o roteador de TODOS os assinantes da RCNet.
#
# Roda na mesma VM do stack do bot (botsgp-*), mas em compose e rede Docker
# separados de proposito: nenhum container daqui enxerga os do bot, e
# vice-versa. Se um dos dois travar ou for comprometido, o outro nao cai
# junto so por estar na mesma maquina - mas ambos SAO a mesma maquina, entao
# um comprometimento do host (nao do container) afeta os dois. Isso e o
# principal motivo para manter o SO atualizado e o SSH bem trancado nesta VM
# a partir de agora - ela passou a ter acesso administrativo ao roteador de
# cada cliente, nao so ao atendimento.
#
# Comece pelo README.md desta pasta: ele tem o passo a passo, incluindo TLS
# real (Let's Encrypt) e o script de backup do Mongo, que sao obrigatorios
# aqui - isto nao e descartavel como um piloto seria.
#
#   cd genieacs && cp .env.example .env && nano .env && docker compose up -d
#
services:
  mongo:
    # 7.0 e o que a comunidade roda com GenieACS 1.2.13+. Nao baixe essa versao
    # sem conferir: o Mongo so aceita upgrade uma major por vez, entao comecar
    # numa antiga cria trabalho de migracao que nao precisava existir.
    image: mongo:7.0
    container_name: genieacs-mongo
    restart: unless-stopped
    # Sem limite, o WiredTiger cache do Mongo reserva ~50% da RAM do host por
    # padrao - nesta VM (3.8GB, compartilhada com o stack do bot em producao)
    # isso e inaceitavel. Teto explicito para nunca disputar memoria com o
    # atendimento no WhatsApp.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    mem_limit: 700m
    volumes:
      - mongo_data:/data/db
    # Sem "ports:": so o GenieACS alcanca o banco.
    networks: [acs]

  genieacs:
    build: .
    container_name: genieacs
    restart: unless-stopped
    depends_on: [mongo]
    mem_limit: 512m
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_JWT_SECRET}
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_CWMP_INTERFACE: 0.0.0.0
      GENIEACS_NBI_INTERFACE: 0.0.0.0
      GENIEACS_FS_INTERFACE: 0.0.0.0
      GENIEACS_UI_INTERFACE: 0.0.0.0
    ports:
      # 7547 CWMP: e por aqui que a ONU fala. Precisa estar acessivel a partir
      # da rede do cliente - e o unico do GenieACS que fica exposto direto.
      - "7547:7547"
      # 7567 FS: servidor de arquivos (firmware, configs).
      - "7567:7567"
      # 3001->3000 UI: interface web, so para a equipe. A 3000 do host ja
      # estava em uso por outro servico nesta VM (confirmado em producao,
      # 2026-08-12), por isso o remapeamento. Feche no firewall para os IPs
      # de voces - ela tem login, mas nao precisa estar aberta ao mundo.
      - "3001:3000"
      # A 7557 (NBI) NAO e publicada de proposito: sem autenticacao propria,
      # quem alcanca a porta escreve na config de todos os roteadores. Quem
      # fala com ela e o nginx abaixo, dentro da rede do compose.
    volumes:
      - genieacs_ext:/opt/genieacs/ext
    # acs_nbi entra so quando o bot usa WIFI_MODO=genieacs: e o unico jeito de
    # o n8n alcancar a NBI sem publica-la no host. Quem entra nela e o
    # container do GenieACS; o Mongo continua isolado na rede acs.
    networks: [acs, acs_nbi]

  # O SGP da RCNet e SaaS: quem chama a NBI vem da nuvem da TSMX, pela
  # internet. Este proxy e o que torna isso aceitavel - TLS, token no caminho
  # e um lugar para pendurar a allowlist de IP quando a TSMX informar o dela.
  nginx:
    image: nginx:1.27-alpine
    container_name: genieacs-nginx
    restart: unless-stopped
    depends_on: [genieacs]
    mem_limit: 64m
    environment:
      ACS_TOKEN: ${ACS_TOKEN}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nbi.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "7558:7558"
    networks: [acs]

volumes:
  mongo_data:
  genieacs_ext:

networks:
  acs:
    driver: bridge
  # Criada pelo compose do bot (../docker-compose.yml), nao por este. Se este
  # stack subir primeiro o docker reclama que ela nao existe - suba o do bot
  # antes, ou crie na mao:  docker network create acs_nbi
  acs_nbi:
    external: true
    name: acs_nbi
