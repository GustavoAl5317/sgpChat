# GenieACS para o PILOTO de troca de Wi-Fi - UMA ONU, de funcionario.
#
# Nao e implantacao de producao. Producao gerencia o roteador de todos os
# assinantes: precisa de TLS no CWMP, credencial forte, backup do Mongo e um
# dono definido. Aqui o objetivo e so provar que o caminho
# bot -> SGP -> GenieACS -> ONU funciona, com um equipamento que alguem da
# equipe controla e pode desligar.
#
# Sobe separado do stack do bot de proposito: se algo aqui travar, o
# atendimento continua de pe.
#
#   cd genieacs && cp .env.example .env && nano .env && docker compose up -d
#
services:
  mongo:
    # 7.0 e o que a comunidade roda com GenieACS 1.2.13+. Nao baixe essa versao
    # sem conferir: o Mongo so aceita upgrade uma major por vez, entao comecar
    # numa antiga cria trabalho de migracao que nao precisava existir.
    image: mongo:7.0
    container_name: genieacs-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Sem "ports:": so o GenieACS alcanca o banco.
    networks: [acs]

  genieacs:
    build: .
    container_name: genieacs
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_JWT_SECRET}
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_CWMP_INTERFACE: 0.0.0.0
      GENIEACS_NBI_INTERFACE: 0.0.0.0
      GENIEACS_FS_INTERFACE: 0.0.0.0
      GENIEACS_UI_INTERFACE: 0.0.0.0
    ports:
      # 7547 CWMP: e por aqui que a ONU fala. Precisa estar acessivel a partir
      # da rede do cliente - e o unico do GenieACS que fica exposto direto.
      - "7547:7547"
      # 7567 FS: servidor de arquivos (firmware, configs).
      - "7567:7567"
      # 3000 UI: interface web, so para a equipe. Feche no firewall para os IPs
      # de voces - ela tem login, mas nao precisa estar aberta ao mundo.
      - "3000:3000"
      # A 7557 (NBI) NAO e publicada de proposito: sem autenticacao propria,
      # quem alcanca a porta escreve na config de todos os roteadores. Quem
      # fala com ela e o nginx abaixo, dentro da rede do compose.
    volumes:
      - genieacs_ext:/opt/genieacs/ext
    networks: [acs]

  # O SGP da RCNet e SaaS: quem chama a NBI vem da nuvem da TSMX, pela
  # internet. Este proxy e o que torna isso aceitavel - TLS, token no caminho
  # e um lugar para pendurar a allowlist de IP quando a TSMX informar o dela.
  nginx:
    image: nginx:1.27-alpine
    container_name: genieacs-nginx
    restart: unless-stopped
    depends_on: [genieacs]
    environment:
      ACS_TOKEN: ${ACS_TOKEN}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nbi.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "7558:7558"
    networks: [acs]

volumes:
  mongo_data:
  genieacs_ext:

networks:
  acs:
    driver: bridge
